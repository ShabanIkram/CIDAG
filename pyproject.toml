[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cidag"
version = "1.0"
description = "Cloud Identity Attack Graph - find privilege escalation paths in cloud IAM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "networkx>=3.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.15",
    "azure-mgmt-authorization>=4.0",
    "azure-mgmt-resource>=23.0",
]
gcp = [
    "google-auth>=2.28",
    "google-cloud-resource-manager>=1.12",
    "google-cloud-iam>=2.15",
]

[project.scripts]
cidag = "cidag.cli.main:main"

[tool.setuptools.packages.find]
include = ["cidag*"]

[tool.setuptools.package-data]
cidag = ["data/*.json"]